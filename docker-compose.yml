services:
  redis:
    image: redis:7-alpine
    container_name: vigilux-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vigilux-network

  db:
    image: postgres:15-alpine
    container_name: vigilux-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vigilux_user
      POSTGRES_PASSWORD: vigilux_password
      POSTGRES_DB: vigilux
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigilux_user -d vigilux"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vigilux-network

  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: vigilux-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://vigilux_user:vigilux_password@db:5432/vigilux
      SECRET_KEY: temporary_secret_key_for_dev
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      BACKEND_CORS_ORIGINS: '["http://localhost:3000"]'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vigilux-network
    volumes:
      - ./backend:/app

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vigilux-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    networks:
      - vigilux-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vigilux-worker
    restart: always
    command: celery -A app.core.celery_app worker --loglevel=info --queues=default,radar,scoring
    environment:
      DATABASE_URL: postgresql://vigilux_user:vigilux_password@db:5432/vigilux
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vigilux-network
    volumes:
      - ./backend:/app

  # Optional: Flower for monitoring Celery tasks
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vigilux-flower
    restart: always
    command: celery -A app.core.celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    depends_on:
      - redis
    networks:
      - vigilux-network

volumes:
  postgres_data:

networks:
  vigilux-network:
    driver: bridge